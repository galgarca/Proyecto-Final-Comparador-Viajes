[project]
name = "proyecto-final"
version = "0.1.0"
description = "Servidor local del recomendador de vacaciones Rumbo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
proyecto-final = "proyecto_final:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
